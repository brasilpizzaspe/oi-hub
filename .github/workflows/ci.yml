name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build production app
        env:
          VITE_SUPABASE_URL: https://scocgrreppdbtqctesio.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_JGN8bSFsGCxTOIubmNmHIA_J36i5Mpp
        run: bun run build
